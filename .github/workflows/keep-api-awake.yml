# Render's free tier sleeps after ~15 min idle, so the first visitor waits ~30s.
# This pings the API every 10 minutes (roughly; GitHub may delay scheduled runs) to keep it warm.
name: Keep API awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 60 https://watchtogether-api.onrender.com/api/health || true
