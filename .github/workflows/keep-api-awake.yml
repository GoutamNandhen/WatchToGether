# Render's free tier sleeps after ~15 min idle, so the first visitor waits ~30s.
# This pings the API every 10 minutes (roughly; GitHub may delay scheduled runs) to keep it warm.
name: Keep API awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 60 https://watchtogether-api.onrender.com/api/health || true
# GitHub can delay or skip scheduled runs by 10-30 min, so this alone won't stop every cold start.
# For a reliable fix, add a free external monitor (cron-job.org or UptimeRobot) hitting
# https://watchtogether-api.onrender.com/api/health every 5 minutes.
